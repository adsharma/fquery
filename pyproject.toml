[build-system]
requires = [
    "setuptools>=42",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "fquery"
version = "0.4"
description = "A graph query engine"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = ["aioitertools"]

[project.optional-dependencies]
fquery = [
    "aioitertools",
]
pydantic = [
    "pydantic",
]
sql = [
    "pypika >= 0.36.5",
]
sqlmodel = [
    "sqlmodel@git+https://github.com/adsharma/sqlmodel.git@sqlmodel_rebuild",
    "duckdb_engine >= 0.14.0",
    "inflection >= 0.5.1",
    "sqlalchemy >= 2.0.36",
]
graphql = [
    "strawberry-graphql >= 0.37.1",
]
polars = [
    "polars >= 0.12.0",
]
pyarrow = [
    "pyarrow",
]
django = [
    "django",
]
malloy = []
cypher = []
test = [
    "pytest",
]
df = [
    "polars >= 0.12.0",
]

[dependency-groups]
fquery = [
    "aioitertools",
]
pydantic = [
    "pydantic",
]
sql = [
    "pypika >= 0.36.5",
]
sqlmodel = [
    "sqlmodel@git+https://github.com/adsharma/sqlmodel.git@sqlmodel_rebuild",
    "duckdb_engine >= 0.14.0",
    "inflection >= 0.5.1",
    "sqlalchemy >= 2.0.36",
]
graphql = [
    "strawberry-graphql >= 0.37.1",
]
polars = [
    "polars >= 0.12.0",
]
pyarrow = [
    "pyarrow",
]
django = [
    "django",
]
malloy = []
cypher = []
test = [
    "pytest",
]
dev = [
    { include-group = "test" },
    { include-group = "pydantic" },
    { include-group = "sql" },
    { include-group = "sqlmodel" },
    { include-group = "graphql" },
    { include-group = "polars" },
    { include-group = "pyarrow" },
    { include-group = "django" },
]

[tool.isort]
profile = "black"
